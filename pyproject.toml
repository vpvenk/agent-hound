[project]
name = "agent-hound"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "autoevals>=0.3.0",
    "braintrust>=0.43.0",
    "langgraph>=1.2.12",
    "litellm>=1.103.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthound"]
