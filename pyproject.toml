[project]
name = "agent-hound"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "autoevals>=0.3.0",
    "braintrust>=0.43.0",
    "langgraph>=1.2.12",
    "litellm>=1.103.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthound"]

[project.optional-dependencies]
# Decision-model rubric checkers (src/agenthound/evals/checker.py). Heavy, so opt-in.
# julia: Julia-1's runtime deps. The julia package itself ships inside the downloaded
# checkpoint folder and is imported from there (see README).
julia = ["torch>=2.6", "transformers>=5.0,<5.1", "safetensors>=0.5", "numpy>=1.26"]
jev = ["typesafe-sdk==0.6.0"]
